# yamlfmt is an extensible command line tool or library to format yaml files.
#
# Get it from: https://github.com/google/yamlfmt/releases
# Config is here: https://github.com/google/yamlfmt/blob/main/docs/config-file.md
formatter:
  type: basic
  indentless_arrays: true
  # Blank lines between groups of keys are load-bearing in the heavily commented
  # workflows: without this, a formatting run silently reflows them into one block.
  retain_line_breaks: true
indent: 2
line_ending: lf
