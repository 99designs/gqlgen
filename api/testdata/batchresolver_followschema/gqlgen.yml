schema:
  - graph/*.graphqls

# follow-schema splits generation into one Data instance per schema file, each holding
# only the objects declared in that file. Cat is declared away from the Animal interface
# on purpose: the batch-parent guard must consult the whole schema, not one file.
exec:
  layout: follow-schema
  dir: graph
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

# Single-file resolvers keep cleanup simple; only the exec layout matters here.
resolver:
  layout: single-file
  filename: graph/schema.resolvers.go
  package: graph

models:
  Dog:
    fields:
      batchProp:
        resolver: true
        batch: true
  Cat:
    fields:
      batchProp:
        resolver: true
        batch: true
