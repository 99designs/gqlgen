# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
# Maintain dependencies for GitHub Actions
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
# Maintain dependencies for Go Modules
- package-ecosystem: "gomod" # See documentation for possible values
  directory: "/" # Location of package manifests
  schedule:
    interval: "weekly"
  ignore:
  - dependency-name: "github.com/gorilla/websocket"
    # For websocket, v1.5.1 has serious bugs
    versions: ["v1.5.1"]
  cooldown:
    default-days: 7
- package-ecosystem: "gomod" # See documentation for possible values
  directory: "/bin/_tools" # Pinned code generators (mockery)
  schedule:
    interval: "weekly"
  # A `tool` directive records its module as `// indirect` in go.mod, and gomod
  # version updates only consider direct dependencies by default. Without this
  # allow entry Dependabot silently never bumps mockery.
  # See https://github.com/dependabot/dependabot-core/issues/12050
  # Each tool added to bin/_tools/go.mod needs its own entry here.
  allow:
  - dependency-name: "github.com/vektra/mockery/v3"
    dependency-type: "all"
  cooldown:
    default-days: 7
- package-ecosystem: "gomod" # See documentation for possible values
  directory: "/_examples" # Location of package manifests
  schedule:
    interval: "weekly"
  ignore:
  - dependency-name: "github.com/gorilla/websocket"
    # For websocket, v1.5.1 has serious bugs
    versions: ["v1.5.1"]
  cooldown:
    default-days: 7
# Maintain dependencies for npm
- package-ecosystem: "npm" # See documentation for possible values
  directory: "integration" # Location of package manifests
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
- package-ecosystem: "npm" # See documentation for possible values
  directory: "_examples/chat" # Location of package manifests
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
- package-ecosystem: "npm" # See documentation for possible values
  directory: "_examples/federation" # Location of package manifests
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
