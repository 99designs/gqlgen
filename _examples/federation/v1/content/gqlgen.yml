schema:
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

federation:
  filename: graph/federation.go
  package: graph
  version: 1
  options:
    entity_resolver_multi: true

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph

autobind:
  - "github.com/99designs/gqlgen/_examples/federation/v1/content/graph/model"

models:
  Date:
    model: github.com/99designs/gqlgen/graphql.String
